version: 2
updates:
  - package-ecosystem: gomod
    directories:
      - /client
      - /services/microvm
      - /types/microvm
    schedule:
      interval: weekly
    commit-message:
      prefix: "build(deps)"
    groups:
      go-modules:
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci(deps)"
    groups:
      github-actions:
        patterns:
          - "*"
